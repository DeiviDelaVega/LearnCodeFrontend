<header class="p-6 md:p-8 flex justify-between items-center w-full max-w-7xl mx-auto">
<div class="flex items-center gap-12">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-gradient-to-br from-primary to-purple-600 rounded-lg flex items-center justify-center text-white shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-2xl">code</span>
</div>
<span class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">Learn<span class="text-primary">Code</span></span>
</div>
<nav class="hidden md:flex items-center gap-8">
<a class="text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-primary dark:hover:text-primary transition-colors"  [routerLink]="['/client/curso']" >Cursos</a>
<a class="text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-primary dark:hover:text-primary transition-colors"  [routerLink]="['/client/plans']">Planes</a>
<a class="text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-primary dark:hover:text-primary transition-colors" [routerLink]="['/client/subscription']">Subscripción</a>
</nav>
</div>
<div class="flex items-center gap-4">
<button class="p-2 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:scale-110 transition-transform" onclick="document.documentElement.classList.toggle('dark')">
<span class="material-symbols-outlined text-xl dark:hidden">dark_mode</span>
<span class="material-symbols-outlined text-xl hidden dark:block">light_mode</span>
</button>
<div class="relative">
  <button
    (click)="toggleMenu()"
    class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-800
           border border-slate-300 dark:border-slate-700
           flex items-center justify-center text-slate-500"
  >
  <img
  *ngIf="userPhoto; else defaultIcon"
  [src]="userPhoto"
  referrerpolicy="no-referrer"
  class="w-10 h-10 rounded-full object-cover border border-slate-300 dark:border-slate-700"
/>

<ng-template #defaultIcon>
  <span class="material-symbols-outlined">person</span>
</ng-template>
  </button>

  <div
    *ngIf="menuOpen"
    class="absolute right-0 mt-3 w-44 rounded-xl glass-card shadow-xl overflow-hidden z-50"
  >
    <button
      (click)="logout()"
      class="w-full px-4 py-3 text-left text-sm
             text-slate-600 dark:text-slate-300
             hover:bg-slate-200 dark:hover:bg-slate-800 transition"
    >
      🚪 Cerrar sesión
    </button>
  </div>
</div>

</div>
</header>


<!-- CONTENIDO -->
<main class="min-h-screen">

  <router-outlet></router-outlet>

</main>


<!-- FOOTER -->
<footer class="p-6 text-center text-sm text-slate-500">

  © 2026 LearnCode. Todos los derechos reservados.

</footer>
