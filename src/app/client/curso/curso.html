
<main class="pt-32 pb-20 px-6 max-w-7xl mx-auto">
  <div class="text-center mb-16 space-y-6">
    <div
      class="inline-flex items-center px-4 py-1.5 rounded-full glass border border-cyan-500/30 text-[10px] font-bold uppercase tracking-[0.2em] text-cyan-400 mb-2">
      <span class="relative flex h-2 w-2 mr-3">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-cyan-400"></span>
      </span>
      Catálogo de Élite
    </div>

    <h1 class="text-6xl md:text-8xl font-display font-bold tracking-tight">
      Potencia tu
      <span class="bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-500">
        Futuro Digital
      </span>
    </h1>

    <p class="max-w-2xl mx-auto text-slate-400 text-xl font-light">
      Experiencias de aprendizaje de alto rendimiento con efectos visuales inmersivos y contenido actualizado.
    </p>

    <div class="mt-12 flex flex-col items-center gap-6">
      <div class="flex items-center gap-4 w-full max-w-2xl">
        <div class="flex-1 relative group">
          <span
            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-cyan-400 transition-colors">
            search
          </span>
          <input type="text" [(ngModel)]="searchTitle" (input)="search()" placeholder="Buscar cursos..."
            class="w-full pl-12 pr-4 py-4 rounded-2xl search-glass text-slate-200 placeholder:text-slate-500 outline-none transition-all" />
        </div>

        <button type="button" (click)="toggleFilters()"
          class="flex items-center gap-2 px-6 py-4 rounded-2xl glass border border-slate-700/50 hover:border-cyan-500/50 text-sm font-semibold tracking-wide transition-all">
          <span class="material-symbols-outlined text-[20px]">tune</span>
          Filtros
        </button>
      </div>

      <div class="w-full max-w-3xl flex flex-wrap justify-center gap-3 overflow-hidden transition-all duration-500"
        [ngClass]="showFilters ? 'filter-visible' : 'filter-hidden'">
        <button *ngFor="let cat of categories" (click)="filterByCategory(cat)"
          class="px-5 py-2 rounded-full glass border border-white/10 text-xs font-bold text-slate-400 hover:text-white transition-all">
          {{ cat }}
        </button>

        <button (click)="clearFilters()"
          class="px-5 py-2 rounded-full glass border border-cyan-500/20 text-xs font-bold text-cyan-400 hover:bg-cyan-500/10 transition-all">
          Todos
        </button>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 mb-16">
    <div *ngFor="let course of filteredCourses; let i = index" class="course-card group"
      [style.--glow-color]="isColor(course.coverUrl) ? course.coverUrl : '#06b6d4'">
      <div class="card-inner">
        <div class="flex justify-center mb-8 relative">
          <div *ngIf="isColor(course.coverUrl)"
            class="w-32 h-32 rounded-3xl shadow-lg transition-transform duration-500 group-hover:scale-110"
            [ngStyle]="{ background: course.coverUrl }"></div>

          <img *ngIf="!isColor(course.coverUrl)" [src]="course.coverUrl" [alt]="course.title"
            class="w-40 h-40 object-contain transition-transform duration-700 group-hover:scale-110 group-hover:rotate-3" />
        </div>

        <div class="text-center space-y-4">
          <h3 class="text-xl font-display font-bold text-white leading-tight">
            {{ course.title }}
          </h3>

          <p class="text-slate-500 text-sm font-medium">
            {{ course.subtitle || 'Inst. Yuls Chambi' }}
          </p>

          <div class="flex items-center justify-center gap-6 pt-6 border-t border-white/5">
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined text-[18px] text-slate-500">list_alt</span>
              <span class="text-[10px] font-bold tracking-wider text-slate-400 uppercase">12 Módulos</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined text-[18px] text-slate-500">folder_open</span>
              <span class="text-[10px] font-bold tracking-wider text-slate-400 uppercase">48 Docs</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="filteredCourses.length === 0" class="text-center py-20">
    <p class="text-slate-500 text-lg">No se encontraron cursos.</p>
  </div>
</main>
